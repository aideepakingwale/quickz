<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161D26" media="(prefers-color-scheme: dark)">
<title>Quickz</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>try { var p = localStorage.getItem('quickz:theme') || 'auto'; document.documentElement.dataset.theme = (p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/player.css">
</head>
<body class="player">
<header class="p-top" id="top" hidden>
  <div class="who">
    <span class="avatar" id="my-avatar"></span>
    <div class="truncate"><div class="nm truncate" id="who"></div><div class="sub" id="sub"></div></div>
  </div>
  <button class="btn ghost sm icon-only" id="snd" type="button" aria-label="Toggle sound"></button>
  <span class="score-pill" id="score" aria-label="Your score"><span id="score-n">0</span><small>pts</small></span>
</header>
<div class="net-banner" id="net" hidden role="status">Reconnecting…</div>
<main class="p-stage" id="stage" aria-live="off"></main>
<div class="sr-only" id="live" aria-live="polite"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/play.js"></script>
</body>
</html>
